<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="특수감각계통, 신경생리, 중추신경계통, 말초신경계통 교안에 근거한 해부생리 기말고사 5지선다 퀴즈와 영어·한글 의학용어 암기">
  <meta name="theme-color" content="#f3f6f1">
  <title>해부생리 기말고사 대비</title>
  <link rel="stylesheet" href="style.css">
  <script src="questions.js" defer></script>
  <script src="terms.js" defer></script>
  <script src="ai.js" defer></script>
  <script src="quiz.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand"><span class="brand-icon" aria-hidden="true">✚</span> 해부생리 퀴즈</div>
      <button id="review" class="review" type="button" aria-pressed="false">오답 노트 <span id="review-count">0</span></button>
    </div>
  </header>
  <main class="layout">
    <aside class="sidebar">
      <h2 id="topics-title">시험 범위</h2>
      <nav id="topics" aria-labelledby="topics-title"></nav>
      <h2 id="terms-title">의학용어 암기</h2>
      <nav id="terms" aria-labelledby="terms-title"></nav>
    </aside>
    <div class="content">
      <section class="hero" aria-labelledby="app-title">
        <div class="hero-copy">
          <h1 id="app-title">해부생리 기말고사 대비</h1>
          <p>기말고사 400문항 · 의학용어 200개</p>
        </div>
        <img class="hero-art" src="brain.webp" alt="" width="280" height="280">
      </section>
      <details class="ai-settings" id="ai-settings">
        <summary>Gemini 모델 및 API 키 설정</summary>
        <form id="ai-key-form" autocomplete="off">
          <label for="ai-model">사용할 모델</label>
          <select id="ai-model">
            <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
            <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
            <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
          </select>
          <label for="ai-key">Gemini API 키</label>
          <input type="password" id="ai-key" maxlength="512" autocomplete="off" spellcheck="false" aria-describedby="ai-key-help" placeholder="API 키 입력">
          <div class="ai-key-actions">
            <button class="secondary" type="submit">이 탭에서 사용</button>
            <button class="secondary" id="ai-clear-key" type="button" disabled>키 지우기</button>
          </div>
          <p class="ai-status" id="ai-key-status" role="status"></p>
          <p id="ai-key-help">키는 이 탭에서만 사용해요. AI 해설을 요청하면 현재 문항과 해설이 Google로 전송되며, 호출은 키에 연결된 프로젝트의 사용량으로 집계돼요.</p>
        </form>
      </details>
      <form id="settings" class="settings" aria-label="출제 설정">
        <label for="difficulty">난이도
          <select id="difficulty" name="difficulty">
            <option value="">모든 난이도</option>
            <option>최상</option>
            <option>상</option>
            <option>중상</option>
            <option>중</option>
          </select>
        </label>
        <label for="length">문항 수
          <select id="length" name="length">
            <option value="10">10문항</option>
            <option value="20" selected>20문항</option>
            <option value="40">40문항</option>
            <option value="all">전체 문항</option>
          </select>
        </label>
        <button class="primary" type="submit">새 퀴즈 시작</button>
      </form>
      <section class="quiz" id="quiz" aria-labelledby="session-title">
        <div class="session-head">
          <h2 id="session-title">전체 문제</h2>
          <div id="position"></div>
        </div>
        <progress id="progress" max="20" value="0" aria-label="답변을 확인한 문항 수"></progress>
        <div id="panel"></div>
      </section>
    </div>
  </main>
</body>
</html>
